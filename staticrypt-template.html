<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>/*[|template_title|]*/0</title>

        <style>
            :root {
                --background: #0d0e11;
                --foreground: #ededed;
                --accent: #2dd4b8;
                --accent-muted: #2fc7a8;
                --text-secondary: #c7cbce;
                --border-subtle: rgba(255, 255, 255, 0.08);
            }

            * {
                box-sizing: border-box;
            }

            .staticrypt-html,
            .staticrypt-body {
                height: 100%;
                margin: 0;
                background: var(--background);
            }

            .staticrypt-content {
                position: relative;
                z-index: 0;
                height: 100%;
                display: flex;
                flex-direction: column;
                font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-page {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                width: 100%;
                max-width: 380px;
                text-align: center;
            }

            /* Floating light background — matches the main site's default background. */
            .bg-orbs {
                position: fixed;
                inset: 0;
                overflow: hidden;
                pointer-events: none;
            }

            .orb-field-ball {
                position: absolute;
                top: 0;
                left: 0;
                border-radius: 50%;
                background: radial-gradient(
                    circle at 35% 32%,
                    rgba(180, 176, 168, 0.32),
                    rgba(150, 146, 138, 0.14) 45%,
                    rgba(120, 116, 108, 0) 72%
                );
                filter: blur(38px);
                will-change: transform;
                mix-blend-mode: screen;
            }

            .staticrypt-title {
                font-size: 1.6em;
                font-weight: 800;
                letter-spacing: -0.01em;
                color: var(--foreground);
                margin: 0;
            }

            .staticrypt-instructions p:last-child {
                color: var(--text-secondary);
                font-size: 14px;
                margin: 8px 0 0;
            }

            .staticrypt-hr {
                margin: 24px 0;
                border: 0;
                border-top: 1px solid var(--border-subtle);
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: transparent;
                border: 1px solid var(--border-subtle);
                border-radius: 8px;
                width: 100%;
                height: 52px;
                margin: 0 0 16px;
                box-sizing: border-box;
                transition: border-color 0.15s ease;
            }

            .staticrypt-password-container:focus-within {
                border-color: var(--accent);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box;
                font-size: 14px;
                outline: 0;
                height: 100%;
                padding: 0 44px 0 16px;
                width: 100%;
                color: var(--foreground);
                font-family: inherit;
            }

            .staticrypt-form input[type="password"]::placeholder,
            input[type="text"]::placeholder {
                color: var(--text-secondary);
                opacity: 0.6;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                opacity: 0.5;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 18px;
                filter: invert(1);
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                letter-spacing: 0.05em;
                outline: 0;
                background: var(--accent);
                width: 100%;
                height: 52px;
                border: 0;
                border-radius: 999px;
                padding: 0;
                color: #0d1620;
                font-size: 13px;
                font-weight: 700;
                font-family: inherit;
                cursor: pointer;
                box-sizing: border-box;
                transition: background 0.15s ease;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: var(--accent-muted);
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--background);
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid var(--border-subtle);
                border-right-color: var(--accent);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt-bg-orbs" class="bg-orbs" aria-hidden="true"></div>

        <div id="staticrypt_loading" class="staticrypt-spinner-container">
            <div class="staticrypt-spinner"></div>
        </div>

        <div id="staticrypt_content" class="staticrypt-content hidden">
            <div class="staticrypt-page">
                <div class="staticrypt-form">
                    <div class="staticrypt-instructions">
                        <p class="staticrypt-title">/*[|template_title|]*/0</p>
                        <p>/*[|template_instructions|]*/0</p>
                    </div>

                    <hr class="staticrypt-hr" />

                    <form id="staticrypt-form" action="#" method="post" autocomplete="off">
                        <div class="staticrypt-password-container">
                            <input
                                id="staticrypt-password"
                                type="password"
                                name="site-passphrase"
                                autocomplete="new-password"
                                placeholder="/*[|template_placeholder|]*/0"
                                autofocus
                            />

                            <img

                                alt="/*[|template_toggle_show|]*/0"
                                title="/*[|template_toggle_show|]*/0"
                                src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NDAgNTEyIj48IS0tIUZvbnQgQXdlc29tZSBGcmVlIDYuNS4yIGJ5IEBmb250YXdlc29tZSAtIGh0dHBzOi8vZm9udGF3ZXNvbWUuY29tIExpY2Vuc2UgLSBodHRwczovL2ZvbnRhd2Vzb21lLmNvbS9saWNlbnNlL2ZyZWUgQ29weXJpZ2h0IDIwMjQgRm9udGljb25zLCBJbmMuLS0+PHBhdGggZD0iTTM4LjggNS4xQzI4LjQtMy4xIDEzLjMtMS4yIDUuMSA5LjJTLTEuMiAzNC43IDkuMiA0Mi45bDU5MiA0NjRjMTAuNCA4LjIgMjUuNSA2LjMgMzMuNy00LjFzNi4zLTI1LjUtNC4xLTMzLjdMNTI1LjYgMzg2LjdjMzkuNi00MC42IDY2LjQtODYuMSA3OS45LTExOC40YzMuMy03LjkgMy4zLTE2LjcgMC0yNC42Yy0xNC45LTM1LjctNDYuMi04Ny43LTkzLTEzMS4xQzQ2NS41IDY4LjggNDAwLjggMzIgMzIwIDMyYy02OC4yIDAtMTI1IDI2LjMtMTY5LjMgNjAuOEwzOC44IDUuMXpNMjIzLjEgMTQ5LjVDMjQ4LjYgMTI2LjIgMjgyLjcgMTEyIDMyMCAxMTJjNzkuNSAwIDE0NCA2NC41IDE0NCAxNDRjMCAyNC45LTYuMyA0OC4zLTE3LjQgNjguN0w0MDggMjk0LjVjOC40LTE5LjMgMTAuNi00MS40IDQuOC02My4zYy0xMS4xLTQxLjUtNDcuOC02OS40LTg4LjYtNzEuMWMtNS44LS4yLTkuMiA2LjEtNy40IDExLjdjMi4xIDYuNCAzLjMgMTMuMiAzLjMgMjAuM2MwIDEwLjItMi40IDE5LjgtNi42IDI4LjNsLTkwLjMtNzAuOHpNMzczIDM4OS45Yy0xNi40IDYuNS0zNC4zIDEwLjEtNTMgMTAuMWMtNzkuNSAwLTE0NC02NC41LTE0NC0xNDRjMC02LjkgLjUtMTMuNiAxLjQtMjAuMkw4My4xIDE2MS41QzYwLjMgMTkxLjIgNDQgMjIwLjggMzQuNSAyNDMuN2MtMy4zIDcuOS0zLjMgMTYuNyAwIDI0LjZjMTQuOSAzNS43IDQ2LjIgODcuNyA5MyAxMzEuMUMxNzQuNSA0NDMuMiAyMzkuMiA0ODAgMzIwIDQ4MGM0Ny44IDAgODkuOS0xMi45IDEyNi4yLTMyLjVMMzczIDM4OS45eiIvPjwvc3ZnPg=="

                        </div>

                </div>
            </div>
        </div>

        <script>
            // Slow-drifting blurred "light ball" background — same physics as the
            // main site's FloatingOrbsBackground, ported inline since this template
            // has no build step.
            (function () {
                function createOrbField(container, options) {
                    var opts = Object.assign({ count: 4, minRadius: 88, maxRadius: 188, speed: 26 }, options || {});
                    var orbs = [];
                    var width = container.clientWidth;
                    var height = container.clientHeight;

                    for (var i = 0; i < opts.count; i++) {
                        var r = opts.minRadius + Math.random() * (opts.maxRadius - opts.minRadius);
                        var el = document.createElement("div");
                        el.className = "orb-field-ball";
                        el.style.width = r * 2 + "px";
                        el.style.height = r * 2 + "px";
                        el.style.opacity = (0.6 + Math.random() * 0.4).toFixed(2);
                        container.appendChild(el);

                        var angle = Math.random() * Math.PI * 2;
                        orbs.push({
                            el: el,
                            x: Math.random() * Math.max(width - r * 2, 1) + r,
                            y: Math.random() * Math.max(height - r * 2, 1) + r,
                            vx: Math.cos(angle) * opts.speed * (0.4 + Math.random() * 0.6),
                            vy: Math.sin(angle) * opts.speed * (0.4 + Math.random() * 0.6),
                            r: r,
                        });
                    }

                    function resolveWallCollisions() {
                        for (var i = 0; i < orbs.length; i++) {
                            var o = orbs[i];
                            if (o.x - o.r < 0) {
                                o.x = o.r;
                                o.vx = Math.abs(o.vx);
                            } else if (o.x + o.r > width) {
                                o.x = width - o.r;
                                o.vx = -Math.abs(o.vx);
                            }
                            if (o.y - o.r < 0) {
                                o.y = o.r;
                                o.vy = Math.abs(o.vy);
                            } else if (o.y + o.r > height) {
                                o.y = height - o.r;
                                o.vy = -Math.abs(o.vy);
                            }
                        }
                    }

                    function resolveOrbCollisions() {
                        for (var i = 0; i < orbs.length; i++) {
                            for (var j = i + 1; j < orbs.length; j++) {
                                var a = orbs[i];
                                var b = orbs[j];
                                var dx = b.x - a.x;
                                var dy = b.y - a.y;
                                var dist = Math.hypot(dx, dy) || 0.0001;
                                var minDist = a.r + b.r;
                                if (dist >= minDist) continue;

                                var overlap = minDist - dist;
                                var nx = dx / dist;
                                var ny = dy / dist;
                                a.x -= (nx * overlap) / 2;
                                a.y -= (ny * overlap) / 2;
                                b.x += (nx * overlap) / 2;
                                b.y += (ny * overlap) / 2;

                                var avn = a.vx * nx + a.vy * ny;
                                var bvn = b.vx * nx + b.vy * ny;
                                a.vx += (bvn - avn) * nx;
                                a.vy += (bvn - avn) * ny;
                                b.vx += (avn - bvn) * nx;
                                b.vy += (avn - bvn) * ny;
                            }
                        }
                    }

                    var raf = 0;
                    var last = performance.now();

                    function tick(now) {
                        var dt = Math.min((now - last) / 1000, 0.05);
                        last = now;

                        for (var i = 0; i < orbs.length; i++) {
                            orbs[i].x += orbs[i].vx * dt;
                            orbs[i].y += orbs[i].vy * dt;
                        }

                        resolveWallCollisions();
                        resolveOrbCollisions();

                        for (var i = 0; i < orbs.length; i++) {
                            var o = orbs[i];
                            o.el.style.transform = "translate3d(" + (o.x - o.r) + "px, " + (o.y - o.r) + "px, 0)";
                        }

                        raf = requestAnimationFrame(tick);
                    }

                    raf = requestAnimationFrame(tick);

                    window.addEventListener("resize", function () {
                        var newWidth = container.clientWidth;
                        var newHeight = container.clientHeight;
                        for (var i = 0; i < orbs.length; i++) {
                            var o = orbs[i];
                            o.x = Math.min(o.x, Math.max(newWidth - o.r, o.r));
                            o.y = Math.min(o.y, Math.max(newHeight - o.r, o.r));
                        }
                        width = newWidth;
                        height = newHeight;
                    });
                }

                var bgContainer = document.getElementById("staticrypt-bg-orbs");
                if (bgContainer) createOrbField(bgContainer);
            })();

            // these variables will be filled when generating the file - the template format is '/*[|variable_name|]*/0'
            const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
            const templateError = "/*[|template_error|]*/0",
                templateToggleAltShow = "/*[|template_toggle_show|]*/0",
                templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
                staticryptConfig = /*[|staticrypt_config|]*/ 0;

            // you can edit these values to customize some of the behavior of StatiCrypt
            const templateConfig = {
                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            // init the staticrypt engine
            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            // try to automatically decrypt on load if there is a saved password
            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

                // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been
                // replaced, no need to do anything
                if (!isSuccessful) {
                    // hide loading screen
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();
                }
            };

            const toggleIcon = document.querySelector(".staticrypt-toggle-password-visibility");
            // these two icons are coming from FontAwesome
            const imgSrcEyeClosed =

            const imgSrcEyeOpened =
                "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1NzYgNTEyIj48IS0tIUZvbnQgQXdlc29tZSBGcmVlIDYuNS4yIGJ5IEBmb250YXdlc29tZSAtIGh0dHBzOi8vZm9udGF3ZXNvbWUuY29tIExpY2Vuc2UgLSBodHRwczovL2ZvbnRhd2Vzb21lLmNvbS9saWNlbnNlL2ZyZWUgQ29weXJpZ2h0IDIwMjQgRm9udGljb25zLCBJbmMuLS0+PHBhdGggZD0iTTI4OCAzMmMtODAuOCAwLTE0NS41IDM2LjgtMTkyLjYgODAuNkM0OC42IDE1NiAxNy4zIDIwOCAyLjUgMjQzLjdjLTMuMyA3LjktMy4zIDE2LjcgMCAyNC42QzE3LjMgMzA0IDQ4LjYgMzU2IDk1LjQgMzk5LjRDMTQyLjUgNDQzLjIgMjA3LjIgNDgwIDI4OCA0ODBzMTQ1LjUtMzYuOCAxOTIuNi04MC42YzQ2LjgtNDMuNSA3OC4xLTk1LjQgOTMtMTMxLjFjMy4zLTcuOSAzLjMtMTYuNyAwLTI0LjZjLTE0LjktMzUuNy00Ni4yLTg3LjctOTMtMTMxLjFDNDMzLjUgNjguOCAzNjguOCAzMiAyODggMzJ6TTE0NCAyNTZhMTQ0IDE0NCAwIDEgMSAyODggMCAxNDQgMTQ0IDAgMSAxIC0yODggMHptMTQ0LTY0YzAgMzUuMy0yOC43IDY0LTY0IDY0Yy03LjEgMC0xMy45LTEuMi0yMC4zLTMuM2MtNS41LTEuOC0xMS45IDEuNi0xMS43IDcuNGMuMyA2LjkgMS4zIDEzLjggMy4yIDIwLjdjMTMuNyA1MS4yIDY2LjQgODEuNiAxMTcuNiA2Ny45czgxLjYtNjYuNCA2Ny45LTExNy42Yy0xMS4xLTQxLjUtNDcuOC02OS40LTg4LjYtNzEuMWMtNS44LS4yLTkuMiA2LjEtNy40IDExLjdjMi4xIDYuNCAzLjMgMTMuMiAzLjMgMjAuM3oiLz48L3N2Zz4=";
            toggleIcon.addEventListener("click", function () {
                const passwordInput = document.getElementById("staticrypt-password");
                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, false);

                if (!isSuccessful) {
                    alert(templateError);
                }
            });
